<svg xmlns="http://www.w3.org/2000/svg" width="400" height="350" viewBox="0 0 400 350" role="img" aria-label="(3, 1)은 e_x 세 개와 e_y 하나를 이은 것이다. 90° 돌리면 e_x는 (0, 1)로, e_y는 (−1, 0)으로 가므로 (−1, 3)이 된다" font-family="sans-serif">
