  <line x1="318" y1="286" x2="318" y2="242" stroke="#4ade80" stroke-width="4" marker-end="url(#rrm-q-y)"/>
  <line x1="186" y1="286" x2="186" y2="154" stroke="#fbbf24" stroke-width="4" marker-end="url(#rrm-q-x)"/>
  <line x1="186" y1="154" x2="142" y2="154" stroke="#4ade80" stroke-width="4" marker-end="url(#rrm-q-y)"/>
