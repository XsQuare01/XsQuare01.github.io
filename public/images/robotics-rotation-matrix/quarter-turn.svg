  <text x="24" y="336" fill="#cbd5e1" font-size="17"><tspan font-weight="bold">e</tspan><tspan font-size="13" dy="5">x</tspan><tspan dy="-5"> </tspan>는 (0, 1)로, <tspan font-weight="bold">e</tspan><tspan font-size="13" dy="5">y</tspan><tspan dy="-5"> </tspan>는 (−1, 0)으로 간다</text>
