<svg xmlns="http://www.w3.org/2000/svg" width="400" height="370" viewBox="0 0 400 370" role="img" aria-label="돌아간 x축은 (cos θ, sin θ), 돌아간 y축은 (−sin θ, cos θ)다. 두 성분 삼각형은 서로 90° 돌린 모양이다" font-family="sans-serif">
  <rect width="400" height="370" rx="8" fill="#0f1117"/>
  <defs><marker id="rrm-a-x" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#fbbf24"/></marker><marker id="rrm-a-y" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#4ade80"/></marker></defs>
  <text x="24" y="34" fill="#e2e8f0" font-size="23">돌아간 두 축의 성분</text>
  <path d="M30 300H390 M230 312V100" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M230 300H332V164" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M230 300V198H94" fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M238.4 288.8L227.2 280.4L218.8 291.6" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M276 300A46 46 0 0 0 257.6 263.2" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="230" y1="300" x2="332" y2="164" stroke="#fbbf24" stroke-width="4" marker-end="url(#rrm-a-x)"/>
  <line x1="230" y1="300" x2="94" y2="198" stroke="#4ade80" stroke-width="4" marker-end="url(#rrm-a-y)"/>
  <g font-size="18">
    <text x="281" y="324" fill="#fbbf24" text-anchor="middle">cos θ</text>
    <text x="342" y="238" fill="#fbbf24">sin θ</text>
    <text x="176" y="220" fill="#4ade80" text-anchor="middle">sin θ</text>
    <text x="222" y="261" fill="#4ade80" text-anchor="end">cos θ</text>
    <text x="302" y="150" fill="#fbbf24" text-anchor="middle"><tspan font-weight="bold">e</tspan>′<tspan font-size="14" dy="5">x</tspan><tspan dy="-5"> </tspan>= (cos θ, sin θ)</text>
    <text x="124" y="184" fill="#4ade80" text-anchor="middle"><tspan font-weight="bold">e</tspan>′<tspan font-size="14" dy="5">y</tspan><tspan dy="-5"> </tspan>= (−sin θ, cos θ)</text>
    <text x="285.5" y="278.3" fill="#cbd5e1" text-anchor="middle">θ</text>
    <text x="222" y="324" fill="#e2e8f0" text-anchor="end">O</text>
  </g>
  <text x="24" y="356" fill="#cbd5e1" font-size="16">그림은 cos θ = 0.6, sin θ = 0.8인 경우다</text>
</svg>
