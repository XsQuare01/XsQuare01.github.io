<svg xmlns="http://www.w3.org/2000/svg" width="400" height="350" viewBox="0 0 400 350" role="img" aria-label="길이 1인 두 화살표 e_x와 u가 40°를 이룰 때, 서로의 방향으로 내린 정사영은 둘 다 길이가 cos 40°다" font-family="sans-serif">
  <rect width="400" height="350" rx="8" fill="#0f1117"/>
  <defs><marker id="rvp-w-x" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#e2e8f0"/></marker><marker id="rvp-w-u" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#e2e8f0"/></marker></defs>
  <text x="24" y="34" fill="#e2e8f0" font-size="23">길이 1인 두 화살표는 서로에게</text>
  <text x="24" y="62" fill="#e2e8f0" font-size="23">같은 길이의 그림자를 드리운다</text>
  <line x1="50" y1="286" x2="292.1" y2="197.9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 5"/>
  <line x1="50" y1="286" x2="226.2" y2="286" stroke="#fbbf24" stroke-width="6"/>
  <line x1="50" y1="286" x2="185" y2="172.7" stroke="#fbbf24" stroke-width="6"/>
  <line x1="226.2" y1="138.2" x2="226.2" y2="286" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="6 4"/>
  <line x1="280" y1="286" x2="185" y2="172.7" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path d="M96 286A46 46 0 0 0 85.2 256.4" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="50" y1="286" x2="280" y2="286" stroke="#e2e8f0" stroke-width="3" marker-end="url(#rvp-w-x)"/>
  <line x1="50" y1="286" x2="226.2" y2="138.2" stroke="#e2e8f0" stroke-width="3" marker-end="url(#rvp-w-u)"/>
  <g font-size="19">
    <text x="280" y="312" fill="#e2e8f0" text-anchor="middle"><tspan font-weight="bold">e</tspan><tspan font-size="14" dy="5">x</tspan><tspan dy="-5"> </tspan></text>
    <text x="236.2" y="132.2" fill="#e2e8f0"><tspan font-weight="bold">u</tspan></text>
    <text x="138.1" y="312" fill="#fbbf24" text-anchor="middle">cos α</text>
    <text x="103.5" y="219.4" fill="#fbbf24" text-anchor="end">cos α</text>
    <text x="108" y="278" fill="#cbd5e1">α</text>
    <text x="42" y="308" fill="#e2e8f0" text-anchor="end">O</text>
  </g>
  <text x="24" y="336" fill="#cbd5e1" font-size="16">두 직각삼각형은 점선(이등분선)에 대해 대칭이다</text>
</svg>
