<svg xmlns="http://www.w3.org/2000/svg" width="400" height="372" viewBox="0 0 400 372" role="img" aria-label="a (3, 1) 다음 b (1, 2)를 이어 붙이면 끝점은 (4, 3)이다. 순서를 바꿔도 같은 점에서 끝난다" font-family="sans-serif">
