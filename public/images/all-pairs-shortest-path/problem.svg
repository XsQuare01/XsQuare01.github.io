<svg viewBox="0 0 680 420" width="1020" height="630" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <rect width="680" height="420" rx="10" fill="#0f1117"/>

  <text x="24" y="32" fill="#e2e8f0" font-size="17" font-weight="700">모든 쌍의 최단 거리</text>
  <text x="24" y="52" fill="#64748b" font-size="13">답은 한 개가 아니라 N² 개다</text>

  <!-- panel divider -->
  <line x1="510" y1="80" x2="510" y2="380" stroke="#1e293b" stroke-width="1"/>

  <!-- ===== left: 4-node weighted graph ===== -->
  <!-- edges -->
  <line x1="190" y1="140" x2="450" y2="110" stroke="#475569" stroke-width="1.5"/>
  <line x1="190" y1="140" x2="170" y2="320" stroke="#475569" stroke-width="1.5"/>
  <line x1="190" y1="140" x2="440" y2="300" stroke="#475569" stroke-width="1.5"/>
  <line x1="450" y1="110" x2="440" y2="300" stroke="#475569" stroke-width="1.5"/>
  <line x1="170" y1="320" x2="440" y2="300" stroke="#475569" stroke-width="1.5"/>

  <!-- edge weight badges -->
  <rect x="309" y="102" width="22" height="18" rx="3" fill="#0f1117" stroke="#334155"/>
  <text x="320" y="116" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="700">1</text>

  <rect x="183" y="221" width="22" height="18" rx="3" fill="#0f1117" stroke="#334155"/>
  <text x="194" y="235" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="700">5</text>

  <rect x="304" y="199" width="22" height="18" rx="3" fill="#0f1117" stroke="#334155"/>
  <text x="315" y="213" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="700">7</text>

  <rect x="448" y="196" width="22" height="18" rx="3" fill="#0f1117" stroke="#334155"/>
  <text x="459" y="210" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="700">1</text>

  <rect x="294" y="313" width="22" height="18" rx="3" fill="#0f1117" stroke="#334155"/>
  <text x="305" y="327" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="700">10</text>

  <!-- nodes -->
  <circle cx="190" cy="140" r="16" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="190" y="145" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">1</text>

  <circle cx="450" cy="110" r="16" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="115" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">2</text>

  <circle cx="170" cy="320" r="16" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="170" y="325" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">3</text>

  <circle cx="440" cy="300" r="16" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="440" y="305" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">4</text>

  <!-- ===== right: empty 4x4 distance matrix ===== -->
  <!-- column headers -->
  <text x="562" y="172" text-anchor="middle" fill="#64748b" font-size="11">1</text>
  <text x="590" y="172" text-anchor="middle" fill="#64748b" font-size="11">2</text>
  <text x="618" y="172" text-anchor="middle" fill="#64748b" font-size="11">3</text>
  <text x="646" y="172" text-anchor="middle" fill="#64748b" font-size="11">4</text>

  <!-- row headers -->
  <text x="534" y="198" text-anchor="end" fill="#64748b" font-size="11">1</text>
  <text x="534" y="226" text-anchor="end" fill="#64748b" font-size="11">2</text>
  <text x="534" y="254" text-anchor="end" fill="#64748b" font-size="11">3</text>
  <text x="534" y="282" text-anchor="end" fill="#64748b" font-size="11">4</text>

  <!-- 4x4 grid, cells left empty -->
  <g fill="none" stroke="#334155" stroke-width="1">
    <rect x="548" y="180" width="28" height="28"/>
    <rect x="576" y="180" width="28" height="28"/>
    <rect x="604" y="180" width="28" height="28"/>
    <rect x="632" y="180" width="28" height="28"/>

    <rect x="548" y="208" width="28" height="28"/>
    <rect x="576" y="208" width="28" height="28"/>
    <rect x="604" y="208" width="28" height="28"/>
    <rect x="632" y="208" width="28" height="28"/>

    <rect x="548" y="236" width="28" height="28"/>
    <rect x="576" y="236" width="28" height="28"/>
    <rect x="604" y="236" width="28" height="28"/>
    <rect x="632" y="236" width="28" height="28"/>

    <rect x="548" y="264" width="28" height="28"/>
    <rect x="576" y="264" width="28" height="28"/>
    <rect x="604" y="264" width="28" height="28"/>
    <rect x="632" y="264" width="28" height="28"/>
  </g>

  <text x="604" y="316" text-anchor="middle" fill="#94a3b8" font-size="12">? — 아직 채우지 않은 칸</text>
</svg>
