<svg viewBox="0 0 680 420" width="1020" height="630" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <rect width="680" height="420" rx="10" fill="#0f1117"/>

  <text x="340" y="32" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">k를 지나는가, 지나지 않는가</text>

  <!-- ===================== top branch: i to j direct ===================== -->
  <text x="340" y="100" text-anchor="middle" fill="#94a3b8" font-size="12">{1..k-1} 만 지나는 길</text>

  <line x1="120" y1="130" x2="520" y2="130" stroke="#93c5fd" stroke-width="2"/>

  <circle cx="120" cy="130" r="16" fill="#1e293b" stroke="#475569" stroke-width="1.6"/>
  <text x="120" y="135" text-anchor="middle" fill="#cbd5e1" font-size="13" font-weight="700">i</text>
  <circle cx="520" cy="130" r="16" fill="#1e293b" stroke="#475569" stroke-width="1.6"/>
  <text x="520" y="135" text-anchor="middle" fill="#cbd5e1" font-size="13" font-weight="700">j</text>

  <text x="340" y="157" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">D^{k-1}[i][j]</text>

  <!-- ===================== bottom branch: i to k to j ===================== -->
  <line x1="120" y1="280" x2="320" y2="280" stroke="#fbbf24" stroke-width="2"/>
  <line x1="320" y1="280" x2="520" y2="280" stroke="#fbbf24" stroke-width="2"/>

  <circle cx="120" cy="280" r="16" fill="#1e293b" stroke="#475569" stroke-width="1.6"/>
  <text x="120" y="285" text-anchor="middle" fill="#cbd5e1" font-size="13" font-weight="700">i</text>
  <circle cx="320" cy="280" r="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2.4"/>
  <text x="320" y="285" text-anchor="middle" fill="#fef3c7" font-size="13" font-weight="700">k</text>
  <circle cx="520" cy="280" r="16" fill="#1e293b" stroke="#475569" stroke-width="1.6"/>
  <text x="520" y="285" text-anchor="middle" fill="#cbd5e1" font-size="13" font-weight="700">j</text>

  <text x="220" y="260" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">D^{k-1}[i][k]</text>
  <text x="420" y="260" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">D^{k-1}[k][j]</text>

  <!-- ===================== merge into min ===================== -->
  <path d="M 536 133 C 570 150, 570 190, 560 205" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <path d="M 536 277 C 570 260, 570 220, 560 205" fill="none" stroke="#64748b" stroke-width="1.4"/>

  <text x="562" y="200" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="700">min</text>

  <text x="620" y="210" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">D^k[i][j]</text>

  <line x1="40" y1="375" x2="640" y2="375" stroke="#1e293b" stroke-width="1"/>
  <text x="340" y="399" text-anchor="middle" fill="#94a3b8" font-size="12">고른 길에 같은 노드가 두 번 나오지 않으므로, k를 지난다면 정확히 한 번 지난다</text>
</svg>
