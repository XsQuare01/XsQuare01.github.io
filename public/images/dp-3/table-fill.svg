<svg viewBox="0 0 860 420" width="1290" height="630" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="dp3tf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="860" height="420" rx="10" fill="#0f1117"/>

  <text x="430" y="32" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600" xml:space="preserve">짧은 구간부터 — 대각선을 따라 바깥으로</text>
  <text x="430" y="53" text-anchor="middle" fill="#64748b" font-size="11" xml:space="preserve">길이 1 대각선부터 채워 길이 2, 길이 3(정답) 순으로 오른쪽 위 모서리까지 나아간다</text>

  <!-- ===== headers ===== -->
  <text x="195" y="100" text-anchor="end" fill="#64748b" font-size="11">i\j</text>
  <g fill="#94a3b8" font-size="13" text-anchor="middle">
    <text x="276" y="100">1</text>
    <text x="430" y="100">2</text>
    <text x="584" y="100">3</text>
  </g>

  <line x1="203" y1="90" x2="203" y2="320" stroke="#1e293b" stroke-width="1"/>
  <line x1="185" y1="108" x2="659" y2="108" stroke="#1e293b" stroke-width="1"/>

  <g fill="#94a3b8" font-size="13" text-anchor="end">
    <text x="195" y="145">1</text>
    <text x="195" y="221">2</text>
    <text x="195" y="297">3</text>
  </g>

  <!-- ===== row i=1 ===== -->
  <!-- M[1,1]=0 base -->
  <rect x="211" y="112" width="130" height="56" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
  <text x="276" y="149" text-anchor="middle" fill="#cbd5e1" font-size="19">0</text>

  <!-- M[1,2]=24 length-2 -->
  <rect x="365" y="112" width="130" height="56" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="430" y="149" text-anchor="middle" fill="#dbeafe" font-size="19" font-weight="600">24</text>

  <!-- M[1,3]=28 answer, amber halo -->
  <rect x="516" y="109" width="136" height="62" rx="8" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="519" y="112" width="130" height="56" rx="6" fill="#3a2c0f" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="584" y="150" text-anchor="middle" fill="#fef3c7" font-size="22" font-weight="700">28</text>

  <!-- ===== row i=2 ===== -->
  <!-- M[2,1] invalid (i>j) -->
  <rect x="211" y="188" width="130" height="56" rx="6" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- M[2,2]=0 base -->
  <rect x="365" y="188" width="130" height="56" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
  <text x="430" y="225" text-anchor="middle" fill="#cbd5e1" font-size="19">0</text>

  <!-- M[2,3]=16 length-2 -->
  <rect x="519" y="188" width="130" height="56" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="584" y="225" text-anchor="middle" fill="#dbeafe" font-size="19" font-weight="600">16</text>

  <!-- ===== row i=3 ===== -->
  <!-- M[3,1], M[3,2] invalid (i>j) -->
  <rect x="211" y="264" width="130" height="56" rx="6" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="365" y="264" width="130" height="56" rx="6" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- M[3,3]=0 base -->
  <rect x="519" y="264" width="130" height="56" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
  <text x="584" y="301" text-anchor="middle" fill="#cbd5e1" font-size="19">0</text>

  <text x="353" y="340" text-anchor="middle" fill="#475569" font-size="10.5" xml:space="preserve">i &gt; j — 하삼각은 사용하지 않음</text>

  <!-- ===== fill-order legend: bottom-up along column j=3 ===== -->
  <text x="690" y="100" text-anchor="middle" fill="#64748b" font-size="10.5" font-weight="600">채우는 순서</text>

  <line x1="649" y1="140" x2="660" y2="140" stroke="#475569" stroke-width="1"/>
  <line x1="649" y1="216" x2="660" y2="216" stroke="#475569" stroke-width="1"/>
  <line x1="649" y1="292" x2="660" y2="292" stroke="#475569" stroke-width="1"/>

  <line x1="690" y1="292" x2="690" y2="140" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#dp3tf-arrow)"/>

  <circle cx="690" cy="292" r="11" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
  <text x="690" y="296" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="700">①</text>
  <text x="710" y="296" fill="#94a3b8" font-size="10.5" xml:space="preserve">길이 1 (기본값)</text>

  <circle cx="690" cy="216" r="11" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="690" y="220" text-anchor="middle" fill="#dbeafe" font-size="11" font-weight="700">②</text>
  <text x="710" y="220" fill="#94a3b8" font-size="10.5">길이 2</text>

  <circle cx="690" cy="140" r="11" fill="#3a2c0f" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="690" y="144" text-anchor="middle" fill="#fef3c7" font-size="11" font-weight="700">③</text>
  <text x="710" y="144" fill="#fbbf24" font-size="10.5" font-weight="600" xml:space="preserve">길이 3 · 정답</text>

  <!-- ===== bottom ===== -->
  <line x1="70" y1="360" x2="790" y2="360" stroke="#1e293b" stroke-width="1"/>

  <text x="430" y="384" text-anchor="middle" fill="#94a3b8" font-size="12" xml:space="preserve">행렬 3개, 차원 배열은 다음과 같다</text>
  <text x="430" y="406" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700" xml:space="preserve">d = [3, 2, 4, 2]</text>
</svg>
