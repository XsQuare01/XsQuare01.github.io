<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" role="img" aria-label="첫 링크 a = (√3, 1)에 둘째 링크 b = (0, 1)을 이으면 손끝은 (√3, 2)다. 둘째 링크의 방향 각은 θ1 + θ2 = 90°다" font-family="sans-serif">
  <rect width="400" height="440" rx="8" fill="#0f1117"/>
  <defs><marker id="rta-f-a" viewBox="0 0 10 10" refX="15.7" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#93c5fd"/></marker><marker id="rta-f-b" viewBox="0 0 10 10" refX="16.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#a78bfa"/></marker><marker id="rta-f-p" viewBox="0 0 10 10" refX="16.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#e2e8f0"/></marker></defs>
