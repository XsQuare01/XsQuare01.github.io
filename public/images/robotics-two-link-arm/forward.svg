  <circle cx="219.9" cy="120" r="6" fill="#a78bfa"/>
  <g font-size="18">
    <text x="56" y="322" fill="#e2e8f0" text-anchor="end">O</text>
    <text x="233.9" y="230" fill="#93c5fd">E (√3, 1)</text>
