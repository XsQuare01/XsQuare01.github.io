  <line x1="219.9" y1="210" x2="268.4" y2="182" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="219.9" y1="210" x2="289.9" y2="210" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 4"/>
  <path d="M108 300A44 44 0 0 0 102.1 278" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
