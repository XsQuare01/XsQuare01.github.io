    <line x1="24" y1="380" x2="52" y2="380" stroke="#a78bfa" stroke-width="4"/><text x="60" y="386"><tspan font-weight="bold">b</tspan> = 1(cos 90°, sin 90°) = (0, 1)</text>
    <line x1="24" y1="408" x2="52" y2="408" stroke="#e2e8f0" stroke-width="2.5" stroke-dasharray="7 5"/><text x="60" y="414"><tspan font-weight="bold">a</tspan> + <tspan font-weight="bold">b</tspan> = (√3, 2)</text>
