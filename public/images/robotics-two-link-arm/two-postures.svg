<svg xmlns="http://www.w3.org/2000/svg" width="400" height="430" viewBox="0 0 400 430" role="img" aria-label="목표점 (2, 1)에 손끝을 놓는 자세는 둘이다. 팔꿈치가 (2, 0)인 자세와 (1.2, 1.6)인 자세이고, 두 자세는 직선 OT에 대해 거울상이다" font-family="sans-serif">
