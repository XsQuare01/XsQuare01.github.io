<svg xmlns="http://www.w3.org/2000/svg" width="400" height="404" viewBox="0 0 400 404" role="img" aria-label="같은 30° 방향에서 길이 1인 끝점 U와 길이 2인 끝점 P. P의 두 좌표는 U의 두 배다" font-family="sans-serif">
  <rect width="400" height="404" rx="8" fill="#0f1117"/>
  <text x="24" y="34" fill="#e2e8f0" font-size="23">같은 방향으로 길이만 두 배</text>
  <path d="M30 300H380 M50 320V64" fill="none" stroke="#64748b" stroke-width="2"/>
  <line x1="50" y1="300" x2="292.5" y2="300" stroke="#fbbf24" stroke-width="3"/>
  <line x1="292.5" y1="300" x2="292.5" y2="160" stroke="#4ade80" stroke-width="3" stroke-dasharray="6 4"/>
  <line x1="171.2" y1="300" x2="171.2" y2="230" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="50" y1="300" x2="292.5" y2="160" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
  <circle cx="171.2" cy="230" r="5" fill="#e2e8f0"/>
  <circle cx="292.5" cy="160" r="7" fill="#93c5fd"/>
  <text x="162" y="220" fill="#e2e8f0" font-size="20" text-anchor="middle">U</text>
  <text x="312" y="156" fill="#e2e8f0" font-size="22" text-anchor="middle">P</text>
  <g font-size="16">
    <text x="171" y="322" fill="#94a3b8" text-anchor="middle">0.87</text>
    <text x="292" y="322" fill="#fbbf24" text-anchor="middle">1.73</text>
    <text x="178" y="270" fill="#94a3b8">0.5</text>
    <text x="300" y="235" fill="#4ade80">1</text>
  </g>
  <text x="38" y="321" fill="#e2e8f0" font-size="20" text-anchor="end">O</text>
  <text x="384" y="306" fill="#e2e8f0" font-size="20">x</text>
  <text x="40" y="72" fill="#e2e8f0" font-size="20" text-anchor="end">y</text>
  <g fill="#cbd5e1" font-size="16">
    <text x="24" y="364">U = (cos 30°, sin 30°) ≈ (0.87, 0.5)</text>
    <text x="24" y="388">P = (2 cos 30°, 2 sin 30°) ≈ (1.73, 1)</text>
  </g>
</svg>
