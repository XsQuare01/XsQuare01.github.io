<svg xmlns="http://www.w3.org/2000/svg" width="400" height="416" viewBox="0 0 400 416" role="img" aria-label="반지름 1인 원 위에서 30°만큼 돌린 막대 끝점의 가로 좌표가 cos θ, 세로 좌표가 sin θ다" font-family="sans-serif">
  <rect width="400" height="416" rx="8" fill="#0f1117"/>
  <text x="24" y="34" fill="#e2e8f0" font-size="23">길이 1인 막대의 끝점</text>
  <path d="M40 215H360 M200 375V62" fill="none" stroke="#64748b" stroke-width="2"/>
  <circle cx="200" cy="215" r="130" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="200" y1="215" x2="312.6" y2="215" stroke="#fbbf24" stroke-width="3"/>
  <line x1="312.6" y1="215" x2="312.6" y2="150" stroke="#4ade80" stroke-width="3" stroke-dasharray="6 4"/>
  <line x1="200" y1="215" x2="312.6" y2="150" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
  <path d="M238 215A38 38 0 0 0 232.9 196" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="312.6" cy="150" r="7" fill="#93c5fd"/>
  <line x1="330" y1="98" x2="317" y2="142" stroke="#94a3b8" stroke-width="1"/>
  <g fill="#94a3b8" font-size="16">
    <text x="336" y="236">0</text>
    <text x="208" y="78">π/2</text>
    <text x="64" y="236" text-anchor="end">π</text>
    <text x="208" y="366">−π/2</text>
  </g>
  <g font-size="17">
    <text x="390" y="92" fill="#e2e8f0" text-anchor="end">(cos θ, sin θ)</text>
    <text x="256" y="238" fill="#fbbf24" text-anchor="middle">cos θ</text>
    <text x="338" y="189" fill="#4ade80">sin θ</text>
    <text x="248" y="175" fill="#93c5fd" text-anchor="middle">1</text>
  </g>
  <text x="252" y="207" fill="#cbd5e1" font-size="18" text-anchor="middle">θ</text>
  <text x="188" y="236" fill="#e2e8f0" font-size="20" text-anchor="end">O</text>
  <text x="366" y="221" fill="#e2e8f0" font-size="20">x</text>
  <text x="192" y="66" fill="#e2e8f0" font-size="20" text-anchor="end">y</text>
  <text x="24" y="400" fill="#cbd5e1" font-size="16">π/2 = 90°, π = 180°, −π/2 = −90°</text>
</svg>
