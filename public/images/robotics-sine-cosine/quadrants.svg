<svg xmlns="http://www.w3.org/2000/svg" width="400" height="444" viewBox="0 0 400 444" role="img" aria-label="길이 2인 막대를 120°만큼 돌리면 끝점은 (−1, √3)이다. 사분면마다 cos θ와 sin θ의 부호가 정해진다" font-family="sans-serif">
  <rect width="400" height="444" rx="8" fill="#0f1117"/>
  <text x="24" y="34" fill="#e2e8f0" font-size="23">120°이면 가로 좌표가 음수다</text>
  <path d="M20 230H380 M230 420V62" fill="none" stroke="#64748b" stroke-width="2"/>
  <line x1="230" y1="230" x2="170" y2="230" stroke="#fbbf24" stroke-width="3"/>
  <line x1="170" y1="230" x2="170" y2="126.1" stroke="#4ade80" stroke-width="3" stroke-dasharray="6 4"/>
  <line x1="230" y1="230" x2="170" y2="126.1" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
  <path d="M264 230A34 34 0 0 0 213 200.6" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="170" cy="126.1" r="7" fill="#93c5fd"/>
  <text x="158" y="112" fill="#e2e8f0" font-size="18" text-anchor="middle">P (−1, √3)</text>
  <text x="256" y="191" fill="#cbd5e1" font-size="17" text-anchor="middle">120°</text>
  <text x="200" y="222" fill="#fbbf24" font-size="17" text-anchor="middle">−1</text>
  <text x="160" y="184" fill="#4ade80" font-size="17" text-anchor="end">√3</text>
  <g fill="#cbd5e1" font-size="17">
    <text x="380" y="90" text-anchor="end">(+, +)</text>
    <text x="30" y="90">(−, +)</text>
    <text x="30" y="400">(−, −)</text>
    <text x="380" y="400" text-anchor="end">(+, −)</text>
  </g>
  <text x="217" y="251" fill="#e2e8f0" font-size="20" text-anchor="end">O</text>
  <text x="386" y="237" fill="#e2e8f0" font-size="20">x</text>
  <text x="217" y="66" fill="#e2e8f0" font-size="20" text-anchor="end">y</text>
  <text x="24" y="432" fill="#94a3b8" font-size="15">괄호는 그 사분면에서 (cos θ, sin θ)의 부호</text>
</svg>
