<svg xmlns="http://www.w3.org/2000/svg" width="400" height="480" viewBox="0 0 400 480" role="img" aria-label="(3, 4)와 (−3, −4)는 y/x가 4/3으로 같지만 원점에서 반대 방향에 있다. 각도는 약 53.13°와 약 −126.87°다" font-family="sans-serif">
  <rect width="400" height="480" rx="8" fill="#0f1117"/>
  <text x="24" y="34" fill="#e2e8f0" font-size="23">y/x가 같아도 방향은 다르다</text>
  <path d="M20 230H380 M200 440V56" fill="none" stroke="#64748b" stroke-width="2"/>
  <line x1="74" y1="398" x2="326" y2="62" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="200" y1="230" x2="308" y2="86" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="230" x2="92" y2="374" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <path d="M240 230A40 40 0 0 0 224 198" fill="none" stroke="#93c5fd" stroke-width="2"/>
  <path d="M252 230A52 52 0 0 1 168.8 271.6" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="308" cy="86" r="7" fill="#93c5fd"/>
  <circle cx="92" cy="374" r="7" fill="#fbbf24"/>
  <text x="322" y="92" fill="#93c5fd" font-size="18">(3, 4)</text>
  <text x="78" y="380" fill="#fbbf24" font-size="18" text-anchor="end">(−3, −4)</text>
  <text x="256" y="208" fill="#93c5fd" font-size="16" text-anchor="middle">53.13°</text>
  <text x="254" y="281" fill="#fbbf24" font-size="16">−126.87°</text>
  <text x="188" y="251" fill="#e2e8f0" font-size="20" text-anchor="end">O</text>
  <text x="386" y="237" fill="#e2e8f0" font-size="20">x</text>
  <text x="188" y="64" fill="#e2e8f0" font-size="20" text-anchor="end">y</text>
  <text x="24" y="448" fill="#cbd5e1" font-size="16">두 점 모두 y/x = 4/3이지만 방향은 반대다</text>
  <text x="24" y="470" fill="#94a3b8" font-size="15">atan2(4, 3) ≈ 53.13° · atan2(−4, −3) ≈ −126.87°</text>
</svg>
