<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 355" width="930" height="533">
  <rect width="620" height="355" fill="#0f1117" rx="10"/>
  <text x="310" y="17" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9.6" fill="#e2e8f0">복잡도 클래스 계층 — NP-Complete = NP ∩ NP-Hard</text>

  <defs>
    <clipPath id="clip-np">
      <ellipse cx="245" cy="165" rx="200" ry="115"/>
    </clipPath>
  </defs>

  <!-- NP region -->
  <ellipse cx="245" cy="165" rx="200" ry="115" fill="rgba(167,139,250,0.08)" stroke="#a78bfa" stroke-width="1.8"/>

  <!-- NP-Hard region (overlaps NP; NOT a superset) -->
  <ellipse cx="430" cy="165" rx="170" ry="115" fill="rgba(251,191,36,0.06)" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- Intersection = NP-Complete, drawn by clipping NP-Hard to NP -->
  <ellipse cx="430" cy="165" rx="170" ry="115" fill="rgba(248,113,113,0.16)" clip-path="url(#clip-np)"/>

  <!-- P region: inside NP, disjoint from NP-Hard -->
  <ellipse cx="145" cy="185" rx="88" ry="62" fill="rgba(74,222,128,0.1)" stroke="#4ade80" stroke-width="1.8"/>
  <text x="145" y="182" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14.4" font-weight="700" fill="#4ade80">P</text>
  <text x="145" y="198" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="7.2" fill="#86efac">DTM, 다항식 시간</text>

  <text x="110" y="88" font-family="system-ui,-apple-system,sans-serif" font-size="11.2" font-weight="700" fill="#a78bfa">NP</text>
  <text x="110" y="100" font-family="system-ui,-apple-system,sans-serif" font-size="7.2" fill="#c4b5fd">NTM, 다항식 시간</text>

  <text x="410" y="88" font-family="system-ui,-apple-system,sans-serif" font-size="11.2" font-weight="700" fill="#fbbf24">NP-Hard</text>
  <text x="410" y="100" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#fcd34d">모든 NP 문제가 귀착됨</text>

  <!-- NP-Complete: the lens only -->
  <text x="350" y="108" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9.6" font-weight="700" fill="#f87171">NP-Complete</text>
  <circle cx="305" cy="140" r="5" fill="#f87171"/>
  <text x="315" y="144" font-family="system-ui,-apple-system,sans-serif" font-size="8.8" fill="#f87171">SAT</text>
  <circle cx="330" cy="175" r="5" fill="#f87171"/>
  <text x="340" y="179" font-family="system-ui,-apple-system,sans-serif" font-size="8.8" fill="#f87171">3-SAT</text>
  <circle cx="305" cy="210" r="5" fill="#f87171"/>
  <text x="315" y="214" font-family="system-ui,-apple-system,sans-serif" font-size="8.8" fill="#f87171">Hamiltonian Path</text>

  <!-- NP-Hard outside NP -->
  <circle cx="500" cy="175" r="4" fill="#fbbf24"/>
  <text x="510" y="179" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#fbbf24">Halting Problem</text>
  <text x="510" y="192" font-family="system-ui,-apple-system,sans-serif" font-size="8" fill="#fbbf24">TSP 최적화</text>

  <text x="310" y="310" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10.4" font-weight="600" fill="#e2e8f0">NP와 NP-Hard는 겹칠 뿐이며, 겹치는 부분만 NP-Complete다</text>
  <text x="310" y="332" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9.6" fill="#94a3b8">P ≠ NP를 가정하고 그린 그림 (P = NP라면 세 영역이 한 덩어리가 된다)</text>
</svg>
