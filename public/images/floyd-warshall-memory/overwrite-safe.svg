<svg viewBox="0 0 680 420" width="1020" height="630" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <rect width="680" height="420" rx="10" fill="#0f1117"/>

  <text x="340" y="32" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">k행과 k열은 변하지 않는다</text>

  <!-- ===================== left: 6x6 grid with row k / col k highlighted ===================== -->
  <!-- column headers -->
  <text x="88" y="82" text-anchor="middle" fill="#64748b" font-size="11">1</text>
  <text x="124" y="82" text-anchor="middle" fill="#64748b" font-size="11">2</text>
  <text x="160" y="82" text-anchor="middle" fill="#64748b" font-size="11">3</text>
  <text x="196" y="82" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="700">k</text>
  <text x="232" y="82" text-anchor="middle" fill="#64748b" font-size="11">5</text>
  <text x="268" y="82" text-anchor="middle" fill="#64748b" font-size="11">6</text>

  <!-- row headers -->
  <text x="60" y="112" text-anchor="end" fill="#64748b" font-size="11">1</text>
  <text x="60" y="148" text-anchor="end" fill="#64748b" font-size="11">2</text>
  <text x="60" y="184" text-anchor="end" fill="#64748b" font-size="11">3</text>
  <text x="60" y="220" text-anchor="end" fill="#f59e0b" font-size="12" font-weight="700">k</text>
  <text x="60" y="256" text-anchor="end" fill="#64748b" font-size="11">5</text>
  <text x="60" y="292" text-anchor="end" fill="#64748b" font-size="11">6</text>

  <g>
    <!-- row 0 (i=1) -->
    <rect x="70" y="90" width="36" height="36" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="106" y="90" width="36" height="36" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="142" y="90" width="36" height="36" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="178" y="90" width="36" height="36" rx="4" fill="#3a2c0f" stroke="#f59e0b" stroke-width="1.8"/>
    <rect x="214" y="90" width="36" height="36" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="250" y="90" width="36" height="36" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>

    <!-- row 1 (i=2) -->
    <rect x="70" y="126" width="36" height="36" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="106" y="126" width="36" height="36" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="142" y="126" width="36" height="36" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="178" y="126" width="36" height="36" rx="4" fill="#3a2c0f" stroke="#f59e0b" stroke-width="1.8"/>
    <rect x="214" y="126" width="36" height="36" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="250" y="126" width="36" height="36" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>

    <!-- row 2 (i=3) -->
    <rect x="70" y="162" width="36" height="36" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="106" y="162" width="36" height="36" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="142" y="162" width="36" height="36" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="178" y="162" width="36" height="36" rx="4" fill="#3a2c0f" stroke="#f59e0b" stroke-width="1.8"/>
    <rect x="214" y="162" width="36" height="36" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="250" y="162" width="36" height="36" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>

    <!-- row 3 (i=k), entire row amber -->
    <rect x="70" y="198" width="36" height="36" rx="4" fill="#3a2c0f" stroke="#f59e0b" stroke-width="1.8"/>
    <rect x="106" y="198" width="36" height="36" rx="4" fill="#3a2c0f" stroke="#f59e0b" stroke-width="1.8"/>
    <rect x="142" y="198" width="36" height="36" rx="4" fill="#3a2c0f" stroke="#f59e0b" stroke-width="1.8"/>
    <rect x="178" y="198" width="36" height="36" rx="4" fill="#3a2c0f" stroke="#f59e0b" stroke-width="2.2"/>
    <text x="196" y="221" text-anchor="middle" fill="#fef3c7" font-size="16" font-weight="700">0</text>
    <rect x="214" y="198" width="36" height="36" rx="4" fill="#3a2c0f" stroke="#f59e0b" stroke-width="1.8"/>
    <rect x="250" y="198" width="36" height="36" rx="4" fill="#3a2c0f" stroke="#f59e0b" stroke-width="1.8"/>

    <!-- row 4 (i=5) -->
    <rect x="70" y="234" width="36" height="36" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="106" y="234" width="36" height="36" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="142" y="234" width="36" height="36" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="178" y="234" width="36" height="36" rx="4" fill="#3a2c0f" stroke="#f59e0b" stroke-width="1.8"/>
    <rect x="214" y="234" width="36" height="36" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="250" y="234" width="36" height="36" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>

    <!-- row 5 (i=6) -->
    <rect x="70" y="270" width="36" height="36" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="106" y="270" width="36" height="36" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="142" y="270" width="36" height="36" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="178" y="270" width="36" height="36" rx="4" fill="#3a2c0f" stroke="#f59e0b" stroke-width="1.8"/>
    <rect x="214" y="270" width="36" height="36" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="250" y="270" width="36" height="36" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  </g>

  <text x="178" y="325" text-anchor="middle" fill="#94a3b8" font-size="12">k행 · k열 = 앰버, (k,k) = 0</text>

  <!-- ===================== right: formula box, blue accent ===================== -->
  <rect x="340" y="108" width="300" height="192" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.3"/>

  <text x="364" y="132" fill="#64748b" font-size="12">(k,k) 칸이 0이므로</text>

  <text x="364" y="160" fill="#dbeafe" font-size="14" font-weight="700">D^k[i][k] = min(</text>
  <text x="380" y="186" fill="#dbeafe" font-size="14" font-weight="700">D^{k-1}[i][k],</text>
  <text x="380" y="212" fill="#dbeafe" font-size="14" font-weight="700">D^{k-1}[i][k] + 0</text>
  <text x="364" y="238" fill="#dbeafe" font-size="14" font-weight="700">)</text>

  <line x1="356" y1="254" x2="624" y2="254" stroke="#1e293b" stroke-width="1"/>

  <text x="364" y="280" fill="#34d399" font-size="14" font-weight="700">D^k[i][k] = D^{k-1}[i][k]</text>

  <line x1="40" y1="375" x2="640" y2="375" stroke="#1e293b" stroke-width="1"/>
  <text x="340" y="399" text-anchor="middle" fill="#94a3b8" font-size="12">읽는 값이 어느 층이든 같으므로 덮어써도 답이 바뀌지 않는다</text>
</svg>
