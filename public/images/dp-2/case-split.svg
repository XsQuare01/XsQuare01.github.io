<svg viewBox="0 0 860 430" width="1290" height="645" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <rect width="860" height="430" rx="10" fill="#0f1117"/>

  <text x="430" y="32" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">마지막 날을 포함하는가 — 결정 하나가 점화식이 된다</text>
  <text x="430" y="53" text-anchor="middle" fill="#64748b" font-size="11">포함하면 전날은 잠기고, 제외하면 전날 값을 그대로 물려받는다</text>

  <line x1="430" y1="76" x2="430" y2="300" stroke="#1e293b" stroke-width="1"/>

  <!-- ===== Left: 포함 (A) ===== -->
  <text x="215" y="100" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">포함 (A)</text>

  <rect x="185" y="112" width="60" height="30" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="215" y="132" text-anchor="middle" fill="#cbd5e1" font-size="12">n</text>

  <g stroke="#334155" stroke-width="1">
    <line x1="215" y1="142" x2="125" y2="180"/>
    <line x1="215" y1="142" x2="215" y2="180"/>
    <line x1="215" y1="142" x2="305" y2="180"/>
  </g>

  <!-- aₙ 획득 -->
  <rect x="90" y="180" width="70" height="30" rx="4" fill="#14352b" stroke="#34d399" stroke-width="1.2"/>
  <text x="125" y="199" text-anchor="middle" fill="#d1fae5" font-size="10.5">aₙ 획득</text>

  <!-- n-1일 잠금 (X) -->
  <rect x="170" y="180" width="90" height="30" rx="4" fill="#2a1414" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4 2"/>
  <text x="215" y="192" text-anchor="middle" fill="#fca5a5" font-size="9.5">n−1일</text>
  <text x="215" y="203" text-anchor="middle" fill="#fca5a5" font-size="9.5">잠금 (X)</text>

  <!-- S(n-2) -->
  <rect x="270" y="180" width="70" height="30" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="305" y="199" text-anchor="middle" fill="#dbeafe" font-size="11">S(n−2)</text>

  <!-- converge into sum -->
  <g stroke="#475569" stroke-width="1">
    <line x1="125" y1="210" x2="188" y2="244"/>
    <line x1="305" y1="210" x2="242" y2="244"/>
  </g>
  <text x="215" y="228" text-anchor="middle" fill="#64748b" font-size="12">+</text>

  <rect x="145" y="244" width="140" height="30" rx="5" fill="#3a2c0f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="215" y="264" text-anchor="middle" fill="#fef3c7" font-size="13" font-weight="700">S(n-2) + aₙ</text>
  <text x="215" y="288" text-anchor="middle" fill="#64748b" font-size="10.5">포함할 때의 값</text>

  <!-- ===== Right: 제외 (B) ===== -->
  <text x="645" y="100" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="700">제외 (B)</text>

  <rect x="615" y="112" width="60" height="30" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="645" y="132" text-anchor="middle" fill="#cbd5e1" font-size="12">n</text>

  <line x1="645" y1="142" x2="645" y2="180" stroke="#334155" stroke-width="1"/>

  <!-- S(n-1) -->
  <rect x="595" y="180" width="100" height="30" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="645" y="199" text-anchor="middle" fill="#dbeafe" font-size="12">S(n−1)</text>

  <line x1="645" y1="210" x2="645" y2="244" stroke="#475569" stroke-width="1"/>

  <rect x="575" y="244" width="140" height="30" rx="5" fill="#3a2c0f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="645" y="264" text-anchor="middle" fill="#fef3c7" font-size="13" font-weight="700">S(n-1)</text>
  <text x="645" y="288" text-anchor="middle" fill="#64748b" font-size="10.5">제외할 때의 값</text>

  <!-- ===== Shared recurrence ===== -->
  <line x1="70" y1="300" x2="790" y2="300" stroke="#1e293b" stroke-width="1"/>

  <text x="430" y="328" text-anchor="middle" font-size="16" font-weight="600">
    <tspan fill="#e2e8f0">S(n) = max( </tspan><tspan fill="#fbbf24">S(n-1)</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#fbbf24">S(n-2)+aₙ</tspan><tspan fill="#e2e8f0"> )</tspan>
  </text>
  <text x="430" y="352" text-anchor="middle" fill="#94a3b8" font-size="12">둘 중 더 큰 값이 그날까지의 최댓값이다</text>
</svg>
