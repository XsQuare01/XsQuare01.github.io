<svg viewBox="0 0 700 430" width="1050" height="645" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="lcs-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/>
    </marker>
    <marker id="lcs-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="700" height="430" rx="10" fill="#0f1117"/>

  <text x="350" y="32" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">마지막 두 글자가 같은가만 물으면 된다</text>
  <text x="350" y="53" text-anchor="middle" fill="#64748b" font-size="11">같으면 대각선에서 하나 늘리고, 다르면 위·왼쪽 중 큰 값을 가져온다</text>

  <!-- ===== 같을 때 ===== -->
  <text x="60" y="96" fill="#4ade80" font-size="13" font-weight="600">xᵢ = yⱼ</text>

  <rect x="210" y="86" width="130" height="48" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
  <text x="275" y="115" text-anchor="middle" fill="#cbd5e1" font-size="13">L(i−1, j−1)</text>

  <rect x="380" y="156" width="130" height="48" rx="4" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="445" y="185" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">L(i, j)</text>

  <path d="M 342,136 L 376,154" fill="none" stroke="#4ade80" stroke-width="1.8" marker-end="url(#lcs-arrow-green)"/>
  <text x="352" y="130" fill="#4ade80" font-size="12" font-weight="600">+1</text>

  <text x="530" y="180" fill="#94a3b8" font-size="11">짝이 하나 늘어난다</text>
  <text x="60" y="118" fill="#64748b" font-size="10.5">망설이지 않아도</text>
  <text x="60" y="134" fill="#64748b" font-size="10.5">손해가 없다</text>

  <line x1="60" y1="224" x2="640" y2="224" stroke="#1e293b" stroke-width="1"/>

  <!-- ===== 다를 때 ===== -->
  <text x="60" y="266" fill="#93c5fd" font-size="13" font-weight="600">xᵢ ≠ yⱼ</text>

  <rect x="380" y="246" width="130" height="48" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
  <text x="445" y="275" text-anchor="middle" fill="#cbd5e1" font-size="13">L(i−1, j)</text>

  <rect x="210" y="326" width="130" height="48" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
  <text x="275" y="355" text-anchor="middle" fill="#cbd5e1" font-size="13">L(i, j−1)</text>

  <rect x="380" y="326" width="130" height="48" rx="4" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="445" y="355" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">L(i, j)</text>

  <path d="M 445,294 L 445,322" fill="none" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#lcs-arrow-blue)"/>
  <path d="M 340,350 L 376,350" fill="none" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#lcs-arrow-blue)"/>

  <text x="530" y="350" fill="#94a3b8" font-size="11">둘 중 큰 값</text>
  <text x="60" y="288" fill="#64748b" font-size="10.5">둘 다 짝지어질 수는</text>
  <text x="60" y="304" fill="#64748b" font-size="10.5">없다</text>

  <text x="350" y="410" text-anchor="middle" fill="#94a3b8" font-size="11">기저는 L(i, 0) = L(0, j) = 0 이다. 빈 접두사와의 공통 부분수열은 빈 수열뿐이다</text>
</svg>
