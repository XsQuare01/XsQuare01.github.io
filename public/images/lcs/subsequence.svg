<svg viewBox="0 0 680 350" width="1020" height="525" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <rect width="680" height="350" rx="10" fill="#0f1117"/>

  <text x="340" y="32" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">지우기만 허용하고 순서는 지킨다</text>
  <text x="340" y="53" text-anchor="middle" fill="#64748b" font-size="11">ACCGGT 에서 무엇을 뽑아낼 수 있는가</text>

  <!-- ===== ACGT : 떨어져 있어도 된다 ===== -->
  <text x="186" y="105" text-anchor="end" fill="#cbd5e1" font-size="13">ACGT</text>

  <rect x="200" y="82" width="44" height="34" rx="4" fill="#1e293b" stroke="#4ade80" stroke-width="1.6"/>
  <rect x="252" y="82" width="44" height="34" rx="4" fill="#1e293b" stroke="#4ade80" stroke-width="1.6"/>
  <rect x="304" y="82" width="44" height="34" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <rect x="356" y="82" width="44" height="34" rx="4" fill="#1e293b" stroke="#4ade80" stroke-width="1.6"/>
  <rect x="408" y="82" width="44" height="34" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <rect x="460" y="82" width="44" height="34" rx="4" fill="#1e293b" stroke="#4ade80" stroke-width="1.6"/>

  <g font-size="15" text-anchor="middle">
    <text x="222" y="105" fill="#4ade80">A</text>
    <text x="274" y="105" fill="#4ade80">C</text>
    <text x="326" y="105" fill="#64748b">C</text>
    <text x="378" y="105" fill="#4ade80">G</text>
    <text x="430" y="105" fill="#64748b">G</text>
    <text x="482" y="105" fill="#4ade80">T</text>
  </g>
  <text x="520" y="105" fill="#4ade80" font-size="11.5">부분수열</text>

  <!-- ===== CCGG : 연속이라 부분문자열도 된다 ===== -->
  <text x="186" y="175" text-anchor="end" fill="#cbd5e1" font-size="13">CCGG</text>

  <rect x="200" y="152" width="44" height="34" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <rect x="252" y="152" width="44" height="34" rx="4" fill="#1e293b" stroke="#4ade80" stroke-width="1.6"/>
  <rect x="304" y="152" width="44" height="34" rx="4" fill="#1e293b" stroke="#4ade80" stroke-width="1.6"/>
  <rect x="356" y="152" width="44" height="34" rx="4" fill="#1e293b" stroke="#4ade80" stroke-width="1.6"/>
  <rect x="408" y="152" width="44" height="34" rx="4" fill="#1e293b" stroke="#4ade80" stroke-width="1.6"/>
  <rect x="460" y="152" width="44" height="34" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>

  <g font-size="15" text-anchor="middle">
    <text x="222" y="175" fill="#64748b">A</text>
    <text x="274" y="175" fill="#4ade80">C</text>
    <text x="326" y="175" fill="#4ade80">C</text>
    <text x="378" y="175" fill="#4ade80">G</text>
    <text x="430" y="175" fill="#4ade80">G</text>
    <text x="482" y="175" fill="#64748b">T</text>
  </g>
  <text x="520" y="168" fill="#4ade80" font-size="11.5">부분수열</text>
  <text x="520" y="184" fill="#94a3b8" font-size="10.5">연속이라 부분문자열도 된다</text>

  <!-- ===== GCT : 순서를 지킬 수 없다 ===== -->
  <text x="186" y="245" text-anchor="end" fill="#cbd5e1" font-size="13">GCT</text>

  <rect x="200" y="222" width="44" height="34" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <rect x="252" y="222" width="44" height="34" rx="4" fill="#1e293b" stroke="#f87171" stroke-width="1.6"/>
  <rect x="304" y="222" width="44" height="34" rx="4" fill="#1e293b" stroke="#f87171" stroke-width="1.6"/>
  <rect x="356" y="222" width="44" height="34" rx="4" fill="#1e293b" stroke="#fbbf24" stroke-width="1.6"/>
  <rect x="408" y="222" width="44" height="34" rx="4" fill="#1e293b" stroke="#fbbf24" stroke-width="1.6"/>
  <rect x="460" y="222" width="44" height="34" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>

  <g font-size="15" text-anchor="middle">
    <text x="222" y="245" fill="#64748b">A</text>
    <text x="274" y="245" fill="#f87171">C</text>
    <text x="326" y="245" fill="#f87171">C</text>
    <text x="378" y="245" fill="#fbbf24">G</text>
    <text x="430" y="245" fill="#fbbf24">G</text>
    <text x="482" y="245" fill="#64748b">T</text>
  </g>
  <text x="520" y="238" fill="#f87171" font-size="11.5">부분수열 아님</text>
  <text x="520" y="254" fill="#94a3b8" font-size="10.5">G 뒤에 C 가 없다</text>

  <text x="340" y="300" text-anchor="middle" fill="#94a3b8" font-size="11">떨어져 있어도 되는 것이 부분수열, 연속이어야 하는 것이 부분문자열이다</text>
  <text x="340" y="322" text-anchor="middle" fill="#64748b" font-size="10.5">CA 도 부분수열이 아니다. A 는 첫 자리 하나뿐이라 어떤 C 보다 앞이다</text>
</svg>
