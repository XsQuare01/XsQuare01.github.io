<svg xmlns="http://www.w3.org/2000/svg" width="400" height="420" viewBox="0 0 400 420" role="img" aria-label="원점을 (1, 2)로 옮기면 A의 좌표는 (0, -1), B는 (3, 3)이 된다. 두 점과 변위는 제자리다" font-family="sans-serif">
