<svg viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <text id="lbl" x="0" y="0" fill="#e5e7eb">Y</text>
    <desc id="note">기준점을 먼저 고른다</desc>
  </defs>
  <rect width="100" height="50" fill="#0f1117"/>
  <g data-step="1" data-step-label="기준점을 놓는다">
    <use href="#lbl" x="20" y="25" aria-describedby="note"/>
    <a xlink:href="#lbl"><circle cx="20" cy="25" r="4" fill="#34d399"/></a>
  </g>
  <g data-step="2" data-step-label="바깥으로 잇는다">
    <a href="https://example.com/#lbl"><line x1="20" y1="25" x2="80" y2="25" stroke="#34d399"/></a>
    <line x1="10" y1="10" x2="20" y2="20" stroke="#34d399" marker-end="url(#absent)"/>
  </g>
</svg>
