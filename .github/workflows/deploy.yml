name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 🔴가 남은 리뷰 리포트가 있으면 배포하지 않는다(#99).
      - name: 리뷰 품질 게이트
        run: python .claude/review_post.py --gate
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Review Gate 워크플로도 이 테스트를 돌리지만, 그쪽은 별개 워크플로라 실패해도
      # 배포를 막지 못한다. 배포 전 강제는 이 job 안에 있어야 성립한다. 설치보다 앞에
      # 두어 빨리 실패하게 한다 — 테스트는 node 내장 모듈만 쓰므로 의존이 없다.
      - name: 빌드 도구 테스트
        run: npm run test:js

      - run: npm install
      - run: node scripts/fetch-ga-stats.mjs
        env:
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GA_SERVICE_ACCOUNT_KEY: ${{ secrets.GA_SERVICE_ACCOUNT_KEY }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
